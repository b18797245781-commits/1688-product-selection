# Skill Manifest - 1688 Product Selection
# 此文件是技能市场上架所需的元数据，用于 ClawHub/SkillHub 发布和 WorkBuddy 客户端市场同步

name: 1688-product-selection
version: 1.0.0
slug: 1688-product-selection
description: "1688选品库MCP服务引导技能。当用户需要通过1688平台进行商品选品、爆品筛选、供应商评估、商品销量分析、热销榜单查询、类目浏览时触发此技能。本技能引导AI正确理解用户选品意图、选择合适的MCP工具、补全关键参数、并以视觉化方式（图片+表格+卡片）展示选品结果。触发本技能后，所有1688选品相关工具调用默认使用店雷达（dld MCP）连接器。"

category: business-operations

# 触发词 - 覆盖用户的自然语言表达
triggers:
  - "1688选品"
  - "1688商品搜索"
  - "1688找货"
  - "1688找货源"
  - "1688批发选品"
  - "1688热销榜"
  - "1688商品分析"
  - "1688类目"
  - "店雷达"
  - "1688爆款"
  - "1688代发"
  - "找1688商品"
  - "1688供应商"
  - "1688销量"
  - "批发选品"

# 标签 - 用于市场搜索和分类
tags:
  - 1688
  - 选品
  - 店雷达
  - 批发
  - 电商
  - 商品分析
  - 热销榜单
  - 一件代发
  - 货源
  - MCP

# 依赖的 MCP 连接器
dependencies:
  mcp:
    - name: "dld MCP"
      label: "店雷达"
      required: true
      website: "https://www.dianleida.net/mcp"
      docs: "https://www.dianleida.net/mcp/docs/"

# 作者信息
author:
  name: "店雷达"
  website: "https://www.dianleida.net"
